services:
  animegabar:
    build: .
    container_name: animegabar-translator
    restart: always
    ports:
      - "80:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Akk@071772022}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID:-}
    volumes:
      - ./data:/app/data
